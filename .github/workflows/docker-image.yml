name: Docker image

# 自托管镜像发布（单仓）：develop 推送只产 sha 预览镜像；v* 版本 tag
# 额外产出版本标签与 latest。verify 全绿才 publish。
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (app + server)
        run: |
          npm run type-check
          npm run type-check:server

      - name: Unit tests
        run: npm test

      - name: Build frontend + server bundle
        run: |
          npm run build
          npm run build:server

      - name: Node smoke (health + app shell)
        run: |
          DATA_DIR=/tmp/cf-navs-ci PORT=3210 SETUP_TOKEN=ci-token node --experimental-sqlite dist-server/index.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3210/api/health; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:3210/api/health
          curl -sf http://127.0.0.1:3210/ | grep -qi '<html' && echo 'shell ok'

      - name: Docker image build
        run: docker build -f docker/Dockerfile -t cf-navs:ci .

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lbjxr/cf-navs
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
