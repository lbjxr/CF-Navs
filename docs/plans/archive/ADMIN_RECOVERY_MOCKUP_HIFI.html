<head>

 <title>管理员密码恢复 · 高保真演示（Issue #24 / REQ-14）</title>
 <style>
  /* 高保真：直接复刻 src/views/Install.svelte 与 src/app.css 的令牌与形态。
     颜色/圆角/阴影/渐变均取自现有源码，仅内容为 /recover 场景。 */

   --transition-fast: 0.18s ease;
   --transition-medium: 0.28s ease;
   --radius-md: 10px;
  }

  * {
   box-sizing: border-box;
  }

  html,
  body {

  }

  body {
   min-height: 100vh;
   font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
   color: #e5eefb;
  }

  /* —— 复刻 .install-page 背景 —— */
  .recover-page {
   min-height: 100dvh;
   display: grid;
   place-items: center;
   padding: clamp(18px, 4vw, 52px);
   background:
    radial-gradient(circle at 14% 18%, rgba(45, 212, 191, 0.2), transparent 30rem),
    radial-gradient(circle at 88% 74%, rgba(96, 165, 250, 0.18), transparent 34rem),
    linear-gradient(145deg, #09111f 0%, #0f172a 52%, #111827 100%);
  }

  /* —— 复刻 .install-card 双栏玻璃卡 —— */
  .recover-card {
   width: min(100%, 980px);

  }

  .recover-intro,
  .recover-form {
   padding: clamp(28px, 5vw, 52px);
  }

  .recover-intro {
   position: relative;
   border-right: 1px solid rgba(148, 163, 184, 0.18);
   background: linear-gradient(155deg, rgba(13, 148, 136, 0.16), rgba(30, 41, 59, 0.08));
  }

  /* —— 复刻 .install-mark 三点连线标记 —— */
  .recover-mark {
   width: 82px;
   height: 48px;
   position: relative;
   margin-bottom: 34px;
  }

  .recover-mark::before {
   content: "";
   position: absolute;
   left: 12px;

   top: 23px;

  h1 {

  .recover-steps {

  }

  .field {
   display: grid;
   gap: 8px;
  }

  label {
   color: #dbeafe;
   font-size: 0.86rem;
   font-weight: 700;
  }

  label .opt {
   color: #77869b;
   font-weight: 400;
   font-size: 0.78rem;
  }

  input {
   width: 100%;
   min-height: 48px;
   padding: 0 14px;
   color: #f8fafc;
   border: 1px solid #334155;
   border-radius: 10px;
   outline: none;
   background: rgba(2, 8, 23, 0.44);
   transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
   font: inherit;
  }

  input::placeholder {
   color: #556478;
  }

  input:focus {
   border-color: #2dd4bf;

  }

  .field .hint {

  }

  .password-grid {
   display: grid;
   grid-template-columns: 1fr 1fr;

  }

  .recover-submit {
   min-height: 50px;
   padding: 0 20px;
   color: #042f2e;

   cursor: pointer;
   transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  }

  .recover-submit:hover:not(:disabled) {
   transform: translateY(-1px);
   box-shadow: 0 18px 36px rgba(45, 212, 191, 0.23);
  }

  .recover-submit:focus-visible {
   outline: 3px solid rgba(125, 211, 252, 0.42);

  }

  .recover-submit:disabled {
   opacity: 0.66;

  }

  .recover-error {
   display: grid;
   gap: 5px;
   padding: 13px 15px;

   border: 1px solid rgba(248, 113, 113, 0.3);
   border-radius: 10px;

  }

  .recover-error code {
   background: rgba(0, 0, 0, 0.28);
   padding: 0 4px;
   border-radius: 4px;
   color: #fda4af;
  }

  .recover-note {
   display: grid;
   gap: 6px;
   padding: 13px 15px;
   color: #bae6fd;
   border: 1px solid rgba(125, 211, 252, 0.28);
   border-radius: 10px;
   background: rgba(12, 74, 110, 0.22);
   font-size: 0.8rem;

  }

  .recover-note code {
   background: rgba(0, 0, 0, 0.28);
   padding: 0 4px;
   border-radius: 4px;
   color: #7dd3fc;
  }

  .recover-success {
   display: grid;
   gap: 8px;
   padding: 15px 16px;
   color: #bbf7d0;
   border: 1px solid rgba(45, 212, 191, 0.35);
   border-radius: 10px;
   background: rgba(6, 78, 59, 0.24);
   font-size: 0.85rem;
   line-height: 1.6;
  }

  .recover-success strong {
   color: #ecfdf5;
   font-size: 0.95rem;
  }

  .link-row {
   display: flex;
   justify-content: center;
  }

  .link-row a {
   color: #7dd3fc;
   font-size: 0.8rem;
   text-decoration: none;
   border-bottom: 1px dotted rgba(125, 211, 252, 0.5);
   padding-bottom: 1px;
  }

  @media (max-width: 760px) {
   .recover-card {
    grid-template-columns: 1fr;
   }

   .recover-intro {
    border-right: 0;
    border-bottom: 1px solid rgba(148, 163, 184, 0.18);
   }

   h1 {
    max-width: none;
   }

   .recover-steps {
    display: none;
   }

   .password-grid {
    grid-template-columns: 1fr;
   }
  }

  @media (prefers-reduced-motion: reduce) {

   input,
   .recover-submit {
    transition: none;
   }
  }

  /* —— 演示用状态切换条（不属于产品，仅评审）—— */
  .demo-bar {
   position: fixed;
   top: 0;
   left: 0;
   right: 0;
   z-index: 50;
   display: flex;
   flex-wrap: wrap;
   gap: 6px;
   align-items: center;
   padding: 8px 12px;
   background: rgba(2, 8, 23, 0.82);
   backdrop-filter: blur(8px);
   border-bottom: 1px solid rgba(148, 163, 184, 0.2);
   font-size: 12px;
   color: #94a3b8;
  }

  .demo-bar b {
   color: #e2e8f0;
   margin-right: 4px;
  }

  .demo-bar button {
   font: inherit;
   cursor: pointer;
   padding: 4px 10px;
   border-radius: 999px;
   border: 1px solid #334155;
   background: rgba(255, 255, 255, 0.04);
   color: #cbd5e1;
   transition: all var(--transition-fast);
  }

  .demo-bar button:hover {
   border-color: #5eead4;
   color: #f8fafc;
  }

  .demo-bar button.active {
   background: linear-gradient(100deg, #5eead4, #7dd3fc);
   color: #042f2e;
   border-color: transparent;
   font-weight: 700;
  }

  .demo-bar .spacer {
   flex: 1;
  }

<body>

 <div class="demo-bar" role="toolbar" aria-label="演示状态切换">
  <b>状态：</b>
  <button data-state="default" class="active">① 恢复表单</button>
  <button data-state="error">② 令牌错误</button>
  <button data-state="ratelimit">③ 限流</button>
  <button data-state="validate">④ 校验失败</button>
  <button data-state="notoken">⑤ 无令牌引导</button>
  <button data-state="success">⑥ 成功</button>
  <button data-state="uninstalled">⑦ 未安装</button>
  <span class="spacer"></span>
  <span class="ref">高保真 · 复刻 Install.svelte 视觉 · Issue #24 / REQ-14</span>
 </div>

 <main class="recover-page" aria-labelledby="recover-title">
  <section class="recover-card">
   <aside class="recover-intro">
    <div class="recover-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="recover-kicker">CF-Navs 控制台</p>
    <h1 id="recover-title">重置管理员密码。</h1>
    <p class="recover-lead">
     使用部署时配置的 SETUP_TOKEN 验证身份，即可为导航站设置新的管理员密码，无需重新部署。
    </p>
    <ol class="recover-steps">
     <li class="is-active" data-step="1"><span>1</span> 输入部署令牌</li>
     <li data-step="2"><span>2</span> 设置新密码</li>
     <li data-step="3"><span>3</span> 重置并登录</li>
    </ol>
   </aside>

   <div class="recover-form" id="formCol">
    <!-- 内容由脚本按状态渲染 -->
   </div>
  </section>
 </main>

 <script>
  const col = document.getElementById('formCol');
  const steps = [...document.querySelectorAll('.recover-steps li')];

  const tokenField = `
    <div class="field">
      <label for="rc-token">SETUP_TOKEN</label>
      <input id="rc-token" type="password" placeholder="粘贴部署时配置的令牌" autocomplete="off" />
      <p class="hint">令牌只随本次请求发送，不会保存在浏览器中。</p>
    </div>`;

  const credFields = `
    <div class="field">
      <label for="rc-user">管理员用户名 <span class="opt">（保留原值，仅重置密码）</span></label>
      <input id="rc-user" type="text" value="admin" disabled />
    </div>
    <div class="password-grid">
      <div class="field">
        <label for="rc-pw">新密码</label>
        <input id="rc-pw" type="password" placeholder="8–12 位，≥2 类字符" />
      </div>
      <div class="field">
        <label for="rc-pw2">确认新密码</label>
        <input id="rc-pw2" type="password" placeholder="再次输入" />
      </div>
    </div>`;

  const submitBtn = (label = '重置并登录') =>
   `<button class="recover-submit" type="button">${label}</button>`;

  const states = {
   default: () => `
      <div class="configuration-panel">
        <p class="configuration-label">身份验证</p>
        <h2>重置管理员密码</h2>
        <p>输入部署令牌并设置新密码。重置成功后将作废所有现有登录会话。</p>
      </div>
      ${tokenField}${credFields}${submitBtn()}
      <div class="link-row"><a href="#">返回登录</a></div>`,

   error: () => `
      <div class="configuration-panel">
        <p class="configuration-label">身份验证</p>
        <h2>重置管理员密码</h2>
      </div>
      <div class="recover-error" role="alert">
        <span>令牌无效或未配置。请核对部署环境中的 SETUP_TOKEN。</span>
        <span style="color:#fca5a5;opacity:.8">HTTP 401 · code=UNAUTHORIZED</span>
      </div>
      ${tokenField}${credFields}${submitBtn()}`,

   ratelimit: () => `
      <div class="configuration-panel">
        <p class="configuration-label">身份验证</p>
        <h2>重置管理员密码</h2>
      </div>
      <div class="recover-error" role="alert">
        <span>尝试过于频繁，请稍后再试。</span>
        <span style="color:#fca5a5;opacity:.8">HTTP 200 · <code>code=RATE_LIMITED</code>（限流后即使令牌正确也被拦截）</span>
      </div>
      ${tokenField}${credFields}${submitBtn()}`,

   validate: () => `
      <div class="configuration-panel">
        <p class="configuration-label">身份验证</p>
        <h2>重置管理员密码</h2>
      </div>
      <div class="recover-error" role="alert">
        <span>新密码需为 8–12 位，且至少包含两类字符。</span>
        <span style="color:#fca5a5;opacity:.8">HTTP 200 · <code>code=BAD_REQUEST</code>（未写入任何数据）</span>
      </div>
      ${tokenField}${credFields}${submitBtn()}`,

   notoken: () => `
      <div class="configuration-panel">
        <p class="configuration-label">身份验证</p>
        <h2>忘记了 SETUP_TOKEN？</h2>
      </div>
      <div class="recover-note">
        <span>令牌不会存储在站点中，每次请求实时校验。若忘记原值，可在
        <strong>Cloudflare 后台 → 设置 → 变量和密钥 → 生产环境</strong>
        新增/编辑类型为<strong>密钥</strong>的 <code>SETUP_TOKEN</code>，重新部署后用新值重置。</span>
      </div>
      ${tokenField}${submitBtn('用新令牌重试')}`,

   success: () => `
      <div class="configuration-panel">
        <p class="configuration-label">完成</p>
        <h2>重置成功</h2>
      </div>
      <div class="recover-success" role="status">
        <strong>✓ 密码已重置，已登录为 admin</strong>
        <span>所有旧登录会话已失效（轮换 JWT secret），其它设备/标签页需重新登录。</span>
      </div>
      <button class="recover-submit" type="button">前往管理后台</button>`,

   uninstalled: () => `
      <div class="configuration-panel">
        <p class="configuration-label">环境校验</p>
        <h2>站点尚未安装</h2>
        <p>未检测到管理员凭据，无需恢复。请先完成初始化。</p>
      </div>
      <div class="recover-note" role="status">
        <span>恢复端点只在已安装站点可用，避免绕过安装流程写入凭据。</span>
      </div>
      <button class="recover-submit" type="button">前往 /install 初始化</button>`,
  };

  const stepByState = {default: 1, error: 1, ratelimit: 1, validate: 2, notoken: 1, success: 3, uninstalled: 1};

  function render(state) {
   col.innerHTML = states[state]();
   const active = stepByState[state] || 1;
   steps.forEach((li) => li.classList.toggle('is-active', Number(li.dataset.step) <= active));
   document.querySelectorAll('.demo-bar button').forEach((b) =>
    b.classList.toggle('active', b.dataset.state === state));
  }

  document.querySelectorAll('.demo-bar button').forEach((b) =>
   b.addEventListener('click', () => render(b.dataset.state)));

  render('default');
 </script>
</body>

</html>
